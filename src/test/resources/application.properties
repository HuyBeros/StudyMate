# =====================================================
# TEST APPLICATION PROPERTIES
# Dedicated PostgreSQL test cluster; never use the application's database.
# =====================================================
spring.application.name=studymate-test

spring.datasource.url=jdbc:postgresql://127.0.0.1:55438/studymate_p1_test?stringtype=unspecified
spring.datasource.username=studymate_p1
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=studymate-super-secret-key-change-this-in-production-at-least-256-bits
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

app.upload.dir=target/test-uploads
app.frontend.url=http://localhost:5173
