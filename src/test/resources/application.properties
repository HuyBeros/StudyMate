# =====================================================
# TEST APPLICATION PROPERTIES
# H2 In-Memory DB (hoặc PostgreSQL local) cho Test suite
# =====================================================
spring.application.name=studymate-test

spring.datasource.url=jdbc:postgresql://localhost:5432/studymate?stringtype=unspecified
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=studymate-super-secret-key-change-this-in-production-at-least-256-bits
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

app.upload.dir=uploads-test
app.frontend.url=http://localhost:5173
