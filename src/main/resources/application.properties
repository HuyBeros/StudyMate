# =====================================================
# APPLICATION
# =====================================================
spring.application.name=studymate

# =====================================================
# DATABASE (PostgreSQL)
# Khi chạy local: set biến môi trường trong IDE/terminal
# Khi deploy lên Render/Neon/Supabase: set biến môi trường trên dashboard
# =====================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studymate?stringtype=unspecified}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP - mặc định của Spring Boot)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# =====================================================
# JPA / HIBERNATE
# validate: chỉ kiểm tra schema khớp với Entity, KHÔNG tự tạo/sửa bảng
# Phù hợp vì bảng đã tạo sẵn bằng SQL script
# =====================================================
# Đổi tạm thành 'update' để Hibernate tự tạo bảng async_jobs mới.
# SAU KHI app startup thành công lần đầu, đổi lại thành 'validate'.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# SQL init - tắt để tránh conflict với ddl-auto=update
spring.sql.init.mode=never
# spring.sql.init.schema-locations=classpath:db/migration_002_add_async_jobs.sql
# spring.sql.init.continue-on-error=true
# spring.jpa.defer-datasource-initialization=true

# =====================================================
# JWT
# =====================================================
jwt.secret=${JWT_SECRET:studymate-super-secret-key-change-this-in-production-at-least-256-bits}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
# 15 phút = 900,000 ms
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}
# 7 ngày  = 604,800,000 ms

# =====================================================
# OAUTH2 - GOOGLE
# Lấy tại: https://console.cloud.google.com
# =====================================================
# Google Client ID — chỉ dùng cho verify JWT phía backend nếu cần
google.client.id=809610594828-lvdaejskin02qevhhsgi5c8j5ps3css6.apps.googleusercontent.com
# KHÔNG cấu hình spring.security.oauth2 ở đây để tránh conflict với GSI frontend flow

# =====================================================
# GEMINI AI
# Lấy tại: https://ai.google.dev
# =====================================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent

# =====================================================
# OPENAI AI
# =====================================================
openai.api.key=${OPENAI_API_KEY:}
openai.api.url=https://api.openai.com/v1/chat/completions
openai.model=gpt-4o-mini
openai.vision-model=gpt-4o-mini

# =====================================================
# GROQ AI
# =====================================================
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile
groq.vision-model=llama-3.2-11b-vision-preview

# =====================================================
# FILE UPLOAD
# =====================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Thư mục lưu file local (khi deploy sẽ đổi sang Cloudinary/S3)
app.upload.dir=${UPLOAD_DIR:uploads}

# =====================================================
# FRONTEND URL (dùng cho CORS và OAuth2 redirect)
# =====================================================
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# =====================================================
# SERVER
# =====================================================
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always

# =====================================================
# LOGGING
# =====================================================
logging.level.com.huyberos.studymate=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
