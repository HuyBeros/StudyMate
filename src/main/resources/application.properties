# =====================================================
# APPLICATION
# =====================================================
spring.application.name=studymate

# =====================================================
# DATABASE (PostgreSQL)
# Khi chạy local: set biến môi trường trong IDE/terminal
# Khi deploy lên Render/Neon/Supabase: set biến môi trường trên dashboard
# =====================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studymate?stringtype=unspecified}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP - mặc định của Spring Boot)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# =====================================================
# JPA / HIBERNATE
# validate: chỉ kiểm tra schema khớp với Entity, KHÔNG tự tạo/sửa bảng
# Phù hợp vì bảng đã tạo sẵn bằng SQL script
# =====================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =====================================================
# JWT
# =====================================================
jwt.secret=${JWT_SECRET:studymate-super-secret-key-change-this-in-production-at-least-256-bits}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
# 15 phút = 900,000 ms
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}
# 7 ngày  = 604,800,000 ms

# =====================================================
# OAUTH2 - GOOGLE
# Bỏ comment khi đã có credentials từ Google Cloud Console
# Lấy tại: https://console.cloud.google.com → APIs & Services → Credentials
# =====================================================
#spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
#spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
#spring.security.oauth2.client.registration.google.scope=openid,email,profile
#spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/oauth2/callback/{registrationId}

# =====================================================
# GEMINI AI
# Lấy tại: https://ai.google.dev
# =====================================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent

# =====================================================
# FILE UPLOAD
# =====================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Thư mục lưu file local (khi deploy sẽ đổi sang Cloudinary/S3)
app.upload.dir=${UPLOAD_DIR:uploads}

# =====================================================
# FRONTEND URL (dùng cho CORS và OAuth2 redirect)
# =====================================================
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# =====================================================
# SERVER
# =====================================================
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always

# =====================================================
# LOGGING
# =====================================================
logging.level.com.huyberos.studymate=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
